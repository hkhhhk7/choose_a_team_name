# The correct procedure: water first, then acid, cap closed in time.
sop: configs/sop/dilute_acid.yaml
lab: configs/bottles.yaml
events:
  - [0.5, enter, beaker_A]
  - [1.0, enter, water]
  - [3.0, pour, water, beaker_A]
  - [4.0, leave, water]
  - [6.0, enter, acid_conc]
  - [7.0, cap_open, acid_conc]
  - [9.0, pour, acid_conc, beaker_A]
  - [10.0, leave, acid_conc]
  - [12.0, cap_close, acid_conc]
end: 60
